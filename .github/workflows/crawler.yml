name: Scheduled Proxies Crawler

on:
  schedule:
    # 每天 UTC 时间 0点 和 12点（北京时间 8点 和 20点）各自动运行一次
    - cron: '0 0,12 * * *'
  # 允许在 GitHub 网页上随时手动点击运行
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler (Skip Alive Check)
        env:
          # 使用 GitHub 自带的 Token 权限，不需要额外自己填 Token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 核心：带上 --skip-alive-check 参数，只抓取、不测速，原汁原味打包
          python subscribe/process.py -s my-config.json --skip-alive-check

      - name: Deploy to Release Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./data
          keep_files: false
          commit_message: "Auto update clash.yaml by GitHub Actions"
